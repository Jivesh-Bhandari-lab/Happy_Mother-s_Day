<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mom, Ask Me Anything ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Petit+Formal+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blush:    #f9e4e8;
    --rose:     #e8a0b0;
    --deep-rose:#c4687a;
    --cream:    #fdf6f0;
    --peach:    #f5d5c5;
    --lavender: #e8dff5;
    --gold:     #d4a96a;
    --text-dark:#5a3040;
    --text-mid: #8a5060;
  }

  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf0f4 0%, #fdf6f0 40%, #f5eef8 100%);
    font-family: 'Jost', sans-serif;
    color: var(--text-dark);
    overflow-x: hidden;
  }

  /* BG shimmer */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 50%, #f9d0dc55 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, #ead5f555 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, #f5d5c555 0%, transparent 50%);
    pointer-events: none;
  }

  /* Mother bg watermark */
  body::after {
    content: '';
    position: fixed; right: -60px; bottom: -60px; z-index: 0;
    width: min(50vw, 380px); height: min(60vh, 480px);
    background: radial-gradient(ellipse, #f9d0dc44 30%, transparent 70%);
    border-radius: 60% 40% 60% 40%;
    pointer-events: none;
    animation: bgPulse 8s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%,100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
    50%      { transform: scale(1.08) rotate(3deg); opacity: 1; }
  }

  /* ===== PETALS ===== */
  .petal {
    position: fixed; z-index: 1;
    border-radius: 60% 40% 60% 40%;
    opacity: 0; pointer-events: none;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0%   { transform: translateY(-40px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  /* ===== LAYOUT ===== */
  .container {
    position: relative; z-index: 2;
    max-width: 800px; margin: 0 auto;
    padding: 3rem 1.5rem 6rem;
    animation: fadeUp 0.8s ease;
  }

  /* Header */
  .header {
    text-align: center; margin-bottom: 2.5rem;
  }
  .header-title {
    font-family: 'Petit Formal Script', cursive;
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--deep-rose);
    text-shadow: 0 0 30px #e8a0b044;
    line-height: 1.3;
  }
  .header-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1rem;
    color: var(--text-mid); margin-top: 0.5rem;
    letter-spacing: 0.05em;
  }
  .header-divider {
    margin: 1.2rem auto 0;
    width: 60px; height: 1px;
    background: linear-gradient(to right, transparent, var(--rose), transparent);
  }

  /* Question cards grid */
  .q-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.2rem;
    margin-bottom: 2rem;
  }

  .q-card {
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(232,160,176,0.4);
    border-radius: 20px;
    padding: 1.4rem 1.6rem;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    backdrop-filter: blur(10px);
    position: relative; overflow: hidden;
    animation: cardIn 0.5s ease both;
  }
  .q-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(249,184,200,0.12), rgba(232,223,245,0.12));
    opacity: 0; transition: opacity 0.3s;
  }
  .q-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px #e8a0b033; border-color: var(--rose); }
  .q-card:hover::before { opacity: 1; }
  .q-card.answered { border-color: var(--deep-rose); box-shadow: 0 4px 20px #e8a0b033; }

  .q-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem; letter-spacing: 0.15em;
    color: var(--rose); margin-bottom: 0.5rem;
    text-transform: uppercase;
  }
  .q-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem; font-style: italic;
    color: var(--text-dark); line-height: 1.5;
    position: relative; z-index: 1;
  }
  .q-icon {
    position: absolute; top: 1rem; right: 1.2rem;
    font-size: 1.2rem; opacity: 0.5;
    transition: opacity 0.3s, transform 0.3s;
  }
  .q-card:hover .q-icon { opacity: 1; transform: scale(1.2); }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== ANSWER MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(90, 48, 64, 0.18);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
    padding: 1.5rem;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal-card {
    background: rgba(255,255,255,0.95);
    border: 1.5px solid rgba(232,160,176,0.5);
    border-radius: 28px;
    padding: 2.5rem;
    max-width: 520px; width: 100%;
    position: relative;
    box-shadow: 0 20px 80px #e8a0b044, 0 4px 20px #c4687a22;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s ease;
    text-align: center;
  }
  .modal-overlay.open .modal-card { transform: scale(1) translateY(0); }

  .modal-q {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1.1rem;
    color: var(--rose); margin-bottom: 1.2rem;
    letter-spacing: 0.02em;
  }
  .bubble-wrap {
    background: linear-gradient(135deg, #fdf0f4, #fdf6f0);
    border: 1px solid rgba(232,160,176,0.3);
    border-radius: 20px 20px 20px 4px;
    padding: 1.4rem 1.6rem;
    margin-bottom: 1.4rem;
    text-align: left;
    min-height: 80px;
    position: relative;
  }
  .bubble-wrap::before {
    content: '❤️';
    position: absolute; top: -12px; left: 16px;
    font-size: 1rem;
  }
  .answer-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.08rem; line-height: 1.8;
    color: var(--text-dark);
  }

  /* Typing cursor */
  .cursor {
    display: inline-block; width: 2px; height: 1em;
    background: var(--rose); margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.7s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

  .modal-hearts {
    display: flex; justify-content: center; gap: 8px;
    margin-bottom: 1.2rem;
    font-size: 1.1rem;
  }
  .modal-heart {
    opacity: 0; transform: translateY(10px);
    animation: heartPop 0.4s ease forwards;
  }

  .modal-close {
    position: absolute; top: 1rem; right: 1.2rem;
    background: none; border: none;
    font-size: 1.3rem; cursor: pointer;
    color: var(--rose); transition: transform 0.3s;
  }
  .modal-close:hover { transform: scale(1.3); }

  @keyframes heartPop {
    from { opacity: 0; transform: translateY(10px) scale(0.5); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Note */
  .note {
    text-align: center; margin: 1rem 0 2rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 0.95rem;
    color: var(--rose); letter-spacing: 0.03em;
    opacity: 0.85;
  }

  /* Next button */
  .next-btn {
    display: block; margin: 2rem auto 0;
    padding: 1rem 2.5rem;
    background: linear-gradient(135deg, #e8a0b0, #c4687a);
    border: none; border-radius: 60px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem; color: #fff;
    cursor: pointer;
    box-shadow: 0 0 30px #e8a0b055;
    transition: transform 0.3s, box-shadow 0.3s;
    animation: glowPulse 3s ease-in-out infinite;
  }
  .next-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 50px #e8a0b088; }
  @keyframes glowPulse {
    0%,100% { box-shadow: 0 0 20px #e8a0b055; }
    50%      { box-shadow: 0 0 40px #e8a0b099; }
  }

  /* Music */
  .music-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    background: rgba(255,255,255,0.7); border: 1px solid var(--rose);
    border-radius: 50%; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.2rem;
    box-shadow: 0 2px 12px #e8a0b033;
    transition: transform 0.3s;
    backdrop-filter: blur(6px);
  }
  .music-btn:hover { transform: scale(1.15); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 500px) {
    .q-grid { grid-template-columns: 1fr; }
    .modal-card { padding: 1.8rem 1.4rem; }
  }
</style>
</head>
<body>

<!-- Petals injected by JS -->
<!-- Main container -->
<div class="container">
  <div class="header">
    <div class="header-title">Mom, Ask Me Anything ❤️</div>
    <div class="header-sub">Things you may want to ask your son</div>
    <div class="header-divider"></div>
  </div>

  <!-- Question cards -->
  <div class="q-grid" id="qGrid"></div>

  <!-- Note -->
  <div class="note">"These are answers my heart always wanted to tell you ❤️"</div>

  <!-- Final button -->
  <button class="next-btn" onclick="goToPoem()">One Last Surprise ❤️</button>
</div>

<!-- Answer Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" onclick="closeModalBtn()">✕</button>
    <div class="modal-q" id="modalQ"></div>
    <div class="bubble-wrap">
      <div class="answer-text" id="answerText"></div>
    </div>
    <div class="modal-hearts" id="modalHearts"></div>
  </div>
</div>

<div class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</div>

<script>
/* ===== DATA ===== */
const qas = [
  {
    q: "Did I scold you too much?",
    a: "You never scolded me to hurt me. You scolded me because you wanted me to become stronger, wiser, and better. Every lesson came from love, even when I didn't understand it then ❤️"
  },
  {
    q: "Have I loved you enough?",
    a: "You gave me a kind of love that made me feel safe even when life wasn't. If I become even half as caring as you, I will consider myself successful ❤️"
  },
  {
    q: "Were you ever upset with me?",
    a: "Sometimes I didn't understand your decisions, but growing up made me realize you carried responsibilities I couldn't even see. Today I feel gratitude much more than hurt ❤️"
  },
  {
    q: "Am I a good mother?",
    a: "You are the reason I learned kindness, patience, and strength. If goodness can shape a person, then yes, you were more than good. You were extraordinary ❤️"
  },
  {
    q: "Did I make mistakes?",
    a: "Every human makes mistakes, but your love always outweighed them. I remember sacrifices more than imperfections ❤️"
  },
  {
    q: "Are you proud of me?",
    a: "Very proud. You built a family, carried struggles quietly, and still gave love. That kind of strength deserves respect ❤️"
  },
  {
    q: "Will you always remember me?",
    a: "You are written into the way I speak, think, care, and live. Forgetting you would mean forgetting a part of myself ❤️"
  },
  {
    q: "Do you really love me?",
    a: "More than words explain. Some people are loved because they are important. Mothers are loved because they become part of our soul ❤️"
  }
];

/* ===== BUILD CARDS ===== */
const grid = document.getElementById('qGrid');
qas.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.style.animationDelay = `${i * 0.08}s`;
  card.innerHTML = `
    <div class="q-number">Question ${i+1}</div>
    <div class="q-text">"${item.q}"</div>
    <div class="q-icon">💬</div>
  `;
  card.addEventListener('click', () => openModal(item, card));
  grid.appendChild(card);
});

/* ===== MODAL ===== */
let typingTimeout = null;

function openModal(item, card) {
  card.classList.add('answered');
  document.getElementById('modalQ').textContent = `"${item.q}"`;
  const answerEl = document.getElementById('answerText');
  answerEl.innerHTML = '';
  document.getElementById('modalHearts').innerHTML = '';
  document.getElementById('modalOverlay').classList.add('open');

  // Typing effect
  if (typingTimeout) clearTimeout(typingTimeout);
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  answerEl.appendChild(cursor);

  let i = 0;
  const text = item.a;
  const speed = 28;

  function type() {
    if (i < text.length) {
      const char = document.createTextNode(text[i]);
      answerEl.insertBefore(char, cursor);
      i++;
      typingTimeout = setTimeout(type, speed);
    } else {
      cursor.remove();
      showHearts();
    }
  }
  setTimeout(type, 400);
}

function showHearts() {
  const heartsEl = document.getElementById('modalHearts');
  const emojis = ['❤️','🌸','💕','✨','🌹'];
  emojis.forEach((e, i) => {
    const span = document.createElement('span');
    span.className = 'modal-heart';
    span.style.animationDelay = `${i * 0.1}s`;
    span.textContent = e;
    heartsEl.appendChild(span);
  });
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
    if (typingTimeout) clearTimeout(typingTimeout);
  }
}
function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
  if (typingTimeout) clearTimeout(typingTimeout);
}

/* ===== PETALS ===== */
const colors = ['#f9b8c8','#f0d0e0','#e8c8f0','#f5d5c5','#f9d0dc','#eec8e8'];
for (let i = 0; i < 20; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  p.style.cssText = `
    left:${Math.random()*100}%;
    top:${-20-Math.random()*40}px;
    background:${colors[~~(Math.random()*colors.length)]};
    width:${10+Math.random()*10}px;
    height:${14+Math.random()*12}px;
    animation-duration:${7+Math.random()*8}s;
    animation-delay:${Math.random()*10}s;
  `;
  document.body.appendChild(p);
}

/* ===== NAVIGATE ===== */
function goToPoem() {
  document.body.style.transition = 'opacity 0.8s ease';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = 'poem.html'; }, 800);
}

/* ===== MUSIC ===== */
let audioCtx, musicOn = false, oscillators = [];
function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  if (!musicOn) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    [261.63, 329.63, 392.00, 440.00].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.value = 0.03;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i * 0.5);
      oscillators.push(osc);
    });
    btn.textContent = '🔊'; musicOn = true;
  } else {
    oscillators.forEach(o => { try { o.stop(); } catch(e){} });
    oscillators = []; audioCtx.close(); audioCtx = null;
    btn.textContent = '🎵'; musicOn = false;
  }
}

/* ===== FADE IN ===== */
document.body.style.opacity = '0';
document.body.style.transition = 'opacity 0.8s ease';
requestAnimationFrame(() => { document.body.style.opacity = '1'; });
</script>
</body>
</html>
