<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate – Best Mother in the World ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Petit+Formal+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose:     #e8a0b0;
    --deep-rose:#c4687a;
    --cream:    #fdf6f0;
    --gold:     #d4a96a;
    --text-dark:#5a3040;
    --text-mid: #8a5060;
  }

  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf0f4 0%, #fdf6f0 40%, #f5eef8 100%);
    font-family: 'Jost', sans-serif;
    color: var(--text-dark);
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 50%, #f9d0dc44 0%, transparent 55%),
      radial-gradient(ellipse at 80% 20%, #ead5f544 0%, transparent 50%),
      radial-gradient(ellipse at 50% 85%, #f5d5c544 0%, transparent 55%);
    pointer-events: none;
  }

  /* Petals */
  .petal {
    position: fixed; z-index: 1;
    border-radius: 60% 40% 60% 40%;
    opacity: 0; pointer-events: none;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0%   { transform: translateY(-40px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0; }
  }

  /* ===== LAYOUT ===== */
  .page-wrap {
    position: relative; z-index: 2;
    max-width: 900px; margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
    animation: fadeUp 0.9s ease;
  }

  /* Back link */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 2rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 0.9rem;
    color: var(--rose); text-decoration: none;
    opacity: 0.75; transition: opacity 0.3s;
  }
  .back-link:hover { opacity: 1; }

  /* Page heading */
  .page-heading {
    text-align: center; margin-bottom: 2rem;
  }
  .page-title {
    font-family: 'Petit Formal Script', cursive;
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--deep-rose);
    text-shadow: 0 0 30px #e8a0b044;
  }
  .page-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1rem;
    color: var(--text-mid); margin-top: 0.5rem;
  }
  .head-line {
    width: 60px; height: 1px; margin: 1rem auto 0;
    background: linear-gradient(to right, transparent, var(--rose), transparent);
  }

  /* ===== CANVAS WRAPPER ===== */
  .cert-outer {
    display: flex; justify-content: center;
    margin-bottom: 2rem;
  }

  /* The visible preview canvas */
  #certCanvas {
    border-radius: 16px;
    box-shadow: 0 12px 60px #e8a0b044, 0 0 0 3px rgba(255,255,255,0.8);
    max-width: 100%;
    height: auto;
    display: block;
    animation: certReveal 1s 0.4s ease both;
  }
  @keyframes certReveal {
    from { opacity: 0; transform: scale(0.94) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* No-photo warning */
  #noPhotoMsg {
    display: none;
    text-align: center;
    padding: 2.5rem;
    background: rgba(255,255,255,0.7);
    border: 1.5px dashed var(--rose);
    border-radius: 20px;
    backdrop-filter: blur(8px);
    margin-bottom: 2rem;
  }
  #noPhotoMsg .warn-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
  #noPhotoMsg p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1.05rem;
    color: var(--text-mid); margin-bottom: 1.2rem;
  }
  #noPhotoMsg a {
    color: var(--deep-rose); font-weight: 400;
    text-decoration: underline;
  }

  /* ===== UPLOAD FALLBACK (if no localStorage photo) ===== */
  .upload-fallback {
    display: none;
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .upload-fallback label {
    display: inline-block;
    padding: 0.7rem 1.8rem;
    background: rgba(255,255,255,0.8);
    border: 1px solid var(--rose);
    border-radius: 30px;
    cursor: pointer;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1rem;
    color: var(--text-mid);
    transition: all 0.3s;
  }
  .upload-fallback label:hover { background: var(--rose); color: #fff; }
  #fallbackInput { display: none; }

  /* ===== ACTION BUTTONS ===== */
  .actions {
    display: flex; flex-wrap: wrap;
    justify-content: center; gap: 1rem;
    margin-top: 0.5rem;
  }

  .btn-download {
    padding: 1rem 2.6rem;
    background: linear-gradient(135deg, #e8a0b0, #c4687a);
    border: none; border-radius: 60px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem; color: #fff;
    cursor: pointer;
    box-shadow: 0 0 30px #e8a0b055;
    transition: transform 0.3s, box-shadow 0.3s;
    animation: glowPulse 3s ease-in-out infinite;
    letter-spacing: 0.03em;
  }
  .btn-download:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 50px #e8a0b099; }

  .btn-secondary {
    padding: 1rem 2rem;
    background: rgba(255,255,255,0.75);
    border: 1px solid var(--rose);
    border-radius: 60px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1.05rem;
    color: var(--text-mid); cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s;
  }
  .btn-secondary:hover { background: var(--rose); color: #fff; border-color: var(--rose); }

  @keyframes glowPulse {
    0%,100% { box-shadow: 0 0 20px #e8a0b055; }
    50%      { box-shadow: 0 0 40px #e8a0b099; }
  }

  /* Music */
  .music-btn {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    background: rgba(255,255,255,0.7); border: 1px solid var(--rose);
    border-radius: 50%; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.2rem;
    box-shadow: 0 2px 12px #e8a0b033;
    backdrop-filter: blur(6px);
    transition: transform 0.3s;
  }
  .music-btn:hover { transform: scale(1.15); }

  /* Download success toast */
  .toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(90,48,64,0.92);
    color: #fff; border-radius: 30px;
    padding: 0.7rem 1.8rem;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 1rem;
    opacity: 0; pointer-events: none;
    transition: all 0.4s ease;
    z-index: 200;
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 500px) {
    .btn-download { padding: 0.85rem 1.8rem; font-size: 1rem; }
  }
</style>
</head>
<body>

<!-- Petals by JS -->

<div class="page-wrap">
  <a href="poem.html" class="back-link">← Back to Memory</a>

  <div class="page-heading">
    <div class="page-title">Her Certificate ❤️</div>
    <div class="page-sub">Official & eternal — signed with love</div>
    <div class="head-line"></div>
  </div>

  <!-- No photo warning -->
  <div id="noPhotoMsg">
    <div class="warn-icon">🌸</div>
    <p>No photo found. Please go back to the memory page and upload a photo first, or upload one directly below.</p>
  </div>

  <!-- Fallback upload if no localStorage -->
  <div class="upload-fallback" id="uploadFallback">
    <label for="fallbackInput">📷 Choose a photo for the certificate</label>
    <input type="file" id="fallbackInput" accept="image/*">
  </div>

  <!-- The certificate canvas -->
  <div class="cert-outer">
    <canvas id="certCanvas"></canvas>
  </div>

  <!-- Action buttons -->
  <div class="actions">
    <button class="btn-download" onclick="downloadCert()">⬇️ Download Certificate</button>
    <button class="btn-secondary" onclick="goBack()">← Back to Memories</button>
    <button class="btn-secondary" onclick="window.location.href=\'index.html\'">🏠 Home</button>
  </div>
</div>

<div class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</div>
<div class="toast" id="toast">Certificate saved! 🌸</div>

<script>
/* ===== PETALS ===== */
const colors = ['#f9b8c8','#f0d0e0','#e8c8f0','#f5d5c5','#f9d0dc'];
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  p.style.cssText = `left:${Math.random()*100}%;top:${-20-Math.random()*40}px;
    background:${colors[~~(Math.random()*colors.length)]};
    width:${10+Math.random()*10}px;height:${14+Math.random()*12}px;
    animation-duration:${7+Math.random()*9}s;animation-delay:${Math.random()*12}s;`;
  document.body.appendChild(p);
}

/* ===== CANVAS CERTIFICATE ===== */
const canvas  = document.getElementById('certCanvas');
const ctx     = canvas.getContext('2d');

// Certificate dimensions (landscape A4-ish, high res)
const CW = 1200, CH = 850;
canvas.width  = CW;
canvas.height = CH;
// CSS display size — responsive
canvas.style.width  = 'min(860px, 100%)';
canvas.style.height = 'auto';

/* ---- Draw the full certificate ---- */
function drawCertificate(photoDataUrl) {
  // Background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, CW, CH);
  bgGrad.addColorStop(0,   '#fff8fa');
  bgGrad.addColorStop(0.4, '#fdf6f0');
  bgGrad.addColorStop(1,   '#f5eef8');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, CW, CH);

  // Outer decorative border (double)
  drawBorder();

  // Watermark rose in background centre
  drawWatermarkRose();

  // Corner ornaments
  drawCornerFlowers();

  // Top seal / badge
  drawSeal(CW / 2, 90);

  // Title text
  drawTitles();

  // Photo frame (left side)
  if (photoDataUrl) {
    drawPhoto(photoDataUrl);
  }

  // Certificate body text (right side)
  drawBody(!!photoDataUrl);

  // Signature line at bottom
  drawSignature();

  // Bottom ribbon decoration
  drawRibbon();
}

/* ---- Border ---- */
function drawBorder() {
  // Outer thick rose gold border
  ctx.strokeStyle = '#d4a96a';
  ctx.lineWidth = 10;
  roundRect(ctx, 18, 18, CW - 36, CH - 36, 18);
  ctx.stroke();

  // Inner thin border
  ctx.strokeStyle = '#e8a0b0';
  ctx.lineWidth = 2.5;
  roundRect(ctx, 34, 34, CW - 68, CH - 68, 12);
  ctx.stroke();

  // Decorative dot-dash inner line
  ctx.strokeStyle = '#f0c8d4';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 6]);
  roundRect(ctx, 44, 44, CW - 88, CH - 88, 8);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---- Watermark rose ---- */
function drawWatermarkRose() {
  ctx.save();
  ctx.globalAlpha = 0.045;
  ctx.translate(CW / 2, CH / 2);

  // Simple rose shape using arcs
  for (let i = 0; i < 8; i++) {
    ctx.save();
    ctx.rotate((i * Math.PI * 2) / 8);
    ctx.beginPath();
    ctx.ellipse(0, -100, 55, 100, 0, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(0, -100, 10, 0, -100, 100);
    g.addColorStop(0, '#e8a0b0'); g.addColorStop(1, '#f9b8c8');
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
  }
  // Centre
  ctx.beginPath();
  ctx.arc(0, 0, 35, 0, Math.PI * 2);
  ctx.fillStyle = '#f0a0b0'; ctx.fill();
  ctx.restore();
}

/* ---- Corner flowers ---- */
function drawCornerFlowers() {
  const positions = [
    [70, 70], [CW - 70, 70], [70, CH - 70], [CW - 70, CH - 70]
  ];
  positions.forEach(([x, y]) => {
    ctx.save(); ctx.translate(x, y);
    // 5 petals
    for (let i = 0; i < 5; i++) {
      ctx.save();
      ctx.rotate((i * Math.PI * 2) / 5);
      ctx.beginPath();
      ctx.ellipse(0, -16, 6, 16, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#f9b8c8'; ctx.globalAlpha = 0.7; ctx.fill();
      ctx.restore();
    }
    // centre dot
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#d4a96a'; ctx.globalAlpha = 0.9; ctx.fill();
    ctx.restore();
  });
}

/* ---- Seal badge ---- */
function drawSeal(x, y) {
  ctx.save(); ctx.translate(x, y);

  // Gold starburst
  ctx.beginPath();
  for (let i = 0; i < 24; i++) {
    const angle = (i * Math.PI * 2) / 24;
    const r = i % 2 === 0 ? 44 : 32;
    const px = Math.cos(angle) * r, py = Math.sin(angle) * r;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
  const sg = ctx.createRadialGradient(0, 0, 8, 0, 0, 44);
  sg.addColorStop(0, '#f5d080'); sg.addColorStop(1, '#c4903a');
  ctx.fillStyle = sg; ctx.fill();

  // Inner circle
  ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2);
  const cg = ctx.createRadialGradient(0, 0, 5, 0, 0, 28);
  cg.addColorStop(0, '#fdf6f0'); cg.addColorStop(1, '#f9e4e8');
  ctx.fillStyle = cg; ctx.fill();

  // Medal emoji text
  ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🌹', 0, 0);
  ctx.restore();
}

/* ---- Titles ---- */
function drawTitles() {
  // "Certificate of Love"
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#c4687a';
  ctx.font = 'italic 28px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('Certificate of Love', CW / 2, 145);

  // Main title
  ctx.fillStyle = '#5a3040';
  ctx.font = 'bold 62px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('Best Mother', CW / 2, 218);

  // Subtitle
  ctx.fillStyle = '#c4687a';
  ctx.font = 'italic 30px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('in the Entire World', CW / 2, 268);

  // Thin gold divider line under title
  ctx.strokeStyle = '#d4a96a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(CW/2 - 220, 294); ctx.lineTo(CW/2 + 220, 294); ctx.stroke();

  // Small roses on divider ends
  ctx.font = '14px serif';
  ctx.fillText('🌸', CW/2 - 230, 294);
  ctx.fillText('🌸', CW/2 + 230, 294);
}

/* ---- Photo frame ---- */
function drawPhoto(dataUrl) {
  const img = new Image();
  img.onload = () => {
    const fx = 80, fy = 320;
    const fw = 300, fh = 320;

    // Rose gold frame shadow
    ctx.shadowColor = '#e8a0b044'; ctx.shadowBlur = 30;

    // Frame border
    const frameGrad = ctx.createLinearGradient(fx-8, fy-8, fx+fw+8, fy+fh+8);
    frameGrad.addColorStop(0,   '#f9b8c8');
    frameGrad.addColorStop(0.3, '#d4a96a');
    frameGrad.addColorStop(0.7, '#e8a0b0');
    frameGrad.addColorStop(1,   '#d4a96a');
    ctx.fillStyle = frameGrad;
    roundRect(ctx, fx - 10, fy - 10, fw + 20, fh + 20, 18);
    ctx.fill();
    ctx.shadowBlur = 0;

    // White inner mat
    ctx.fillStyle = '#fff8f9';
    roundRect(ctx, fx - 4, fy - 4, fw + 8, fh + 8, 12);
    ctx.fill();

    // Photo clipped inside
    ctx.save();
    roundRect(ctx, fx, fy, fw, fh, 10);
    ctx.clip();

    // Cover-fit the image
    const ir = img.width / img.height;
    const fr = fw / fh;
    let sx = 0, sy = 0, sw = img.width, sh = img.height;
    if (ir > fr) { sw = img.height * fr; sx = (img.width - sw) / 2; }
    else          { sh = img.width / fr;  sy = (img.height - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, fx, fy, fw, fh);
    ctx.restore();

    // Frame inner glow overlay
    const photoGlow = ctx.createRadialGradient(fx+fw/2, fy+fh/2, fh*0.2, fx+fw/2, fy+fh/2, fh*0.7);
    photoGlow.addColorStop(0, 'rgba(255,255,255,0)');
    photoGlow.addColorStop(1, 'rgba(249,184,200,0.08)');
    ctx.fillStyle = photoGlow;
    roundRect(ctx, fx, fy, fw, fh, 10);
    ctx.fill();

    // Caption below photo
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#8a5060';
    ctx.font = 'italic 16px "Cormorant Garamond", Georgia, serif';
    ctx.fillText('Our beautiful memory 🌸', fx + fw / 2, fy + fh + 16);

    // Redraw signature after photo (image is async)
    drawSignature();
  };
  img.src = dataUrl;
}

/* ---- Body text ---- */
function drawBody(hasPhoto) {
  const tx = hasPhoto ? 420 : CW / 2;
  const align = hasPhoto ? 'left' : 'center';
  const lineW = hasPhoto ? CW - 440 : CW - 200;

  ctx.textAlign = align; ctx.textBaseline = 'top';

  // "This certificate is lovingly presented to"
  ctx.fillStyle = '#8a5060';
  ctx.font = 'italic 18px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('This certificate is lovingly presented to', tx, 320);

  // Recipient name
  ctx.fillStyle = '#c4687a';
  ctx.font = 'italic bold 38px "Cormorant Garamond", Georgia, serif';
  wrapText(ctx, 'Geeta Bhandari', tx, 355, lineW, 48);

  // Underline
  ctx.strokeStyle = '#d4a96a'; ctx.lineWidth = 1;
  ctx.beginPath();
  if (hasPhoto) { ctx.moveTo(tx, 405); ctx.lineTo(tx + lineW, 405); }
  else          { ctx.moveTo(CW/2 - 160, 405); ctx.lineTo(CW/2 + 160, 405); }
  ctx.stroke();

  // "AKA…" tagline
  ctx.fillStyle = '#8a5060';
  ctx.font = 'italic 17px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('AKA — The Best Mother in the World', tx, 415);

  // Body paragraph
  ctx.fillStyle = '#5a3040';
  ctx.font = '16px "Cormorant Garamond", Georgia, serif';
  const body = [
    'For your endless love that never asked for anything in return.',
    'For the sacrifices you made before we even knew the word.',
    'For every worry you carried quietly, and every smile you gifted freely.',
    'For being the warmth that made home feel like home.',
    '',
    'You are not just a mother. You are a miracle.',
  ];
  let yy = 450;
  body.forEach(line => {
    if (line === '') { yy += 10; return; }
    ctx.fillText(line, tx, yy);
    yy += 28;
  });

  // Issued by / date
  ctx.fillStyle = '#8a5060';
  ctx.font = 'italic 15px "Cormorant Garamond", Georgia, serif';
  const today = new Date().toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
  ctx.fillText(`Issued on this day: ${today}`, tx, yy + 10);
}

/* ---- Signature ---- */
function drawSignature() {
  // Left signature
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';

  // Signature line 1 (son's name — script style)
  ctx.fillStyle = '#5a3040';
  ctx.font = 'italic 22px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('Jivesh Bhandari', 220, CH - 140);

  ctx.strokeStyle = '#c4687a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(120, CH - 118); ctx.lineTo(320, CH - 118); ctx.stroke();

  ctx.fillStyle = '#8a5060';
  ctx.font = 'italic 13px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('Your Son, with all his love', 220, CH - 110);

  // Right seal / stamp
  ctx.save(); ctx.translate(CW - 200, CH - 130);
  // Circular stamp outline
  ctx.strokeStyle = '#d4a96a'; ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.arc(0, 0, 55, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = '#e8a0b0'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#c4687a';
  ctx.font = 'bold 11px "Cormorant Garamond", Georgia, serif';
  // Arc text "OFFICIALLY CERTIFIED" around the top
  const txt = 'OFFICIALLY  CERTIFIED';
  txt.split('').forEach((ch, i) => {
    const angle = -Math.PI / 2 + (i - txt.length / 2) * 0.14;
    ctx.save();
    ctx.rotate(angle);
    ctx.translate(0, -36);
    ctx.rotate(angle + Math.PI/2);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });

  ctx.font = '28px serif'; ctx.fillText('❤️', 0, 6);
  ctx.font = 'italic 10px "Cormorant Garamond", Georgia, serif';
  ctx.fillStyle = '#8a5060';
  ctx.fillText('Mother\'s Day 2025', 0, 28);
  ctx.restore();

  // Bottom tagline
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#c4687a';
  ctx.font = 'italic 14px "Cormorant Garamond", Georgia, serif';
  ctx.fillText('~ Made with love, for the woman who made everything possible ~', CW / 2, CH - 55);
}

/* ---- Ribbon ---- */
function drawRibbon() {
  // A subtle horizontal decorative band at very bottom inside border
  const ry = CH - 72;
  ctx.fillStyle = 'rgba(232,160,176,0.08)';
  ctx.fillRect(54, ry, CW - 108, 18);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#d4a96a';
  ctx.font = '11px serif';
  const hearts = '❤️  🌸  ❤️  🌸  ❤️  🌸  ❤️  🌸  ❤️  🌸  ❤️  🌸  ❤️';
  ctx.fillText(hearts, CW / 2, ry + 9);
}

/* ---- Utils ---- */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '', cy = y;
  words.forEach(w => {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line.trim(), x, cy); line = w + ' '; cy += lineH;
    } else { line = test; }
  });
  if (line) ctx.fillText(line.trim(), x, cy);
}

/* ===== INIT ===== */
function init() {
  let photo = null;
  try { photo = localStorage.getItem('momPhoto'); } catch(e) {}

  if (photo) {
    drawCertificate(photo);
  } else {
    // Show fallback upload option
    document.getElementById('noPhotoMsg').style.display = 'block';
    document.getElementById('uploadFallback').style.display = 'block';
    drawCertificate(null); // draw without photo
  }
}

// Fallback file input
document.getElementById('fallbackInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { localStorage.setItem('momPhoto', ev.target.result); } catch(err) {}
    document.getElementById('noPhotoMsg').style.display = 'none';
    document.getElementById('uploadFallback').style.display = 'none';
    drawCertificate(ev.target.result);
  };
  reader.readAsDataURL(file);
});

/* ===== DOWNLOAD ===== */
function downloadCert() {
  // Give the canvas a moment if photo is still loading
  setTimeout(() => {
    const link = document.createElement('a');
    link.download = 'Geeta_Bhandari_Best_Mother_Certificate.png';
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
    showToast();
  }, 300);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

/* ===== NAVIGATION ===== */
function goBack() {
  document.body.style.transition = 'opacity 0.8s ease';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = 'poem.html'; }, 800);
}

/* ===== MUSIC ===== */
let audioCtx, musicOn = false, oscillators = [];
function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  if (!musicOn) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    [261.63, 293.66, 329.63, 392.00, 440.00].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.value = 0.03;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + i * 0.55);
      oscillators.push(osc);
    });
    btn.textContent = '🔊'; musicOn = true;
  } else {
    oscillators.forEach(o => { try { o.stop(); } catch(e){} });
    oscillators = []; audioCtx.close(); audioCtx = null;
    btn.textContent = '🎵'; musicOn = false;
  }
}

/* ===== FADE IN & START ===== */
document.body.style.opacity = '0';
document.body.style.transition = 'opacity 0.9s ease';
requestAnimationFrame(() => { document.body.style.opacity = '1'; });

// Wait for Google Fonts to load for canvas rendering
document.fonts.ready.then(() => { init(); });
</script>
